spring:
  application:
    name: p2p-tutoring-marketplace
  main:
    allow-circular-references: true
  # MySQL Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/tutoring_marketplace
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false
    open-in-view: false

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/tutoring_marketplace

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Security
  security:
    user:
      password: admin

# Logging
logging:
  level:
    root: INFO
    com.tutormarketplace: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# JWT Configuration
app:
  jwt:
    secret: your-secret-key-change-in-production-very-long-string-min-256-bits-required
    expiration: 86400000